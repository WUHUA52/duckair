<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#7fb6e6}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas>
<script src="../src/core.js"></script><script src="../src/look.js"></script><script src="../src/plane.js"></script>
<script>
const c = document.getElementById('c'); const ctx = c.getContext('2d');
const S = 5; c.width = PB_W * S * 3; c.height = PB_H * S * 2; ctx.imageSmoothingEnabled = false;
const env = { t: 1.3, speed: 1, inten: 1, ax: 0, ay: 0, rng: mulberry32(3), attention: 0 };
const poses = [
  () => { DUCKS.forEach(d => { d.look = 1; d.gaze = 0; d.wave = 0; d.quack = 0; }); },
  () => { DUCKS.forEach(d => { d.look = 0; d.gaze = 0; }); },
  () => { DUCKS.forEach(d => { d.look = 0.4; d.gaze = 1; }); DUCKS[1].photo = 1.0; },
  () => { DUCKS.forEach(d => { d.look = -1; d.gaze = 0; d.photo = 0; }); },
  () => { DUCKS.forEach(d => { d.look = 0; d.wave = 1; d.quack = 0.1; }); },
  () => { DUCKS.forEach(d => { d.look = 1; d.wave = 0; d.quack = 0; d.blink = 0.1; }); },
];
for (let i = 0; i < 6; i++) {
  poses[i]();
  for (let k = 0; k < 30; k++) DUCKS.forEach(d => updateScarf(d, 1/60, { ...env, t: env.t + k/60 }));
  paintPlane({ prop: 0.4 + i }, env, i === 5 ? '#1b2560' : '#000', i === 5 ? 0.4 : 0, i === 5 ? 1 : 0, true);
  ctx.drawImage(planeOut, 0, 0, PB_W, PB_H, (i % 3) * PB_W * S, Math.floor(i / 3) * PB_H * S, PB_W * S, PB_H * S);
}
</script></body></html>
